<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión Comercial Biogreen</title>
<style>
  :root {
    --bg:#F5F7F3; --surface:#FFFFFF; --border:#DDE4D7;
    --text:#14201A; --muted:#566257; --faint:#8A968B;
    --accent:#00873E; --accent-dark:#006D30; --accent-soft:#E1F1E5;
    --bad:#B34A3B; --bad-soft:#F4DED8;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E1310; --surface:#161F19; --border:#293429;
      --text:#E7EEE7; --muted:#98A79A; --faint:#6B7A6D;
      --accent:#38B76A; --accent-dark:#2C9A57; --accent-soft:#16281C;
      --bad:#D2695A; --bad-soft:#33201C;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0; padding:0; min-height:100vh;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font);
    display:flex; align-items:center; justify-content:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .gate{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:32px 30px 28px; max-width:420px; width:100%;
    box-shadow:0 1px 2px rgba(20,32,26,.04), 0 12px 40px rgba(20,32,26,.08);
    display:flex; flex-direction:column; gap:18px;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand img{height:44px; width:auto; display:block;}
  .brand-txt h1{font-size:1.1rem; font-weight:600; margin:0; letter-spacing:-.01em;}
  .brand-txt h1 b{color:var(--accent); font-weight:700;}
  .brand-txt p{margin:2px 0 0; font-size:.82rem; color:var(--muted);}
  .divider{height:1px; background:var(--border); margin:2px 0 4px;}
  .title{font-size:.96rem; font-weight:600; margin:0;}
  .subtitle{font-size:.85rem; color:var(--muted); margin:4px 0 0; line-height:1.4;}
  label{font-size:.8rem; font-weight:500; color:var(--muted); margin-bottom:6px; display:block;}
  .pw-shell{display:flex; align-items:center; background:var(--bg);
    border:1.5px solid var(--border); border-radius:10px; transition:.15s;}
  .pw-shell:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .pw-shell > svg{margin:0 4px 0 12px; color:var(--faint); flex:none;}
  .pw-shell input{
    flex:1; min-width:0; background:none; border:none; outline:none;
    color:var(--text); font-family:inherit; font-size:.98rem;
    padding:11px 14px 11px 8px;
  }
  .pw-toggle{
    background:none; border:none; cursor:pointer; padding:0 12px; color:var(--faint);
    display:grid; place-items:center;
  }
  .pw-toggle:hover{color:var(--muted);}
  button.enter{
    appearance:none; background:var(--accent); color:#fff;
    border:none; border-radius:10px; font-family:inherit; font-size:.95rem;
    font-weight:600; padding:12px 20px; cursor:pointer; transition:.15s;
  }
  button.enter:hover{background:var(--accent-dark);}
  button.enter:disabled{opacity:.6; cursor:wait;}
  .err{
    background:var(--bad-soft); color:var(--bad); font-size:.82rem;
    padding:9px 12px; border-radius:8px;
    display:flex; align-items:center; gap:8px;
  }
  .err[hidden]{display:none;}
  .foot{font-size:.72rem; color:var(--faint); text-align:center; margin-top:2px;}
</style>
</head>

RyAwpntEQMqhjk8Snjzh36YJkhRUjyNoJF8oBJlFJribfalogoy41NP";
  const ITER = 250000;

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function decrypt(pw){
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey(
      'raw', enc.encode(pw), {name:'PBKDF2'}, false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: b64(SALT), iterations: ITER, hash:'SHA-256' },
      km,
      { name:'AES-GCM', length:256 },
      false, ['decrypt']
    );
    const buf = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv: b64(IV) },
      key,
      b64(PAYLOAD)
    );
    return new TextDecoder().decode(buf);
  }

  const $ = id => document.getElementById(id);
  const err = $('err'), errmsg = $('errmsg'), btn = $('enterBtn'), pw = $('pw');
  const tgl = $('tgl'), eyeOn = $('eye-on'), eyeOff = $('eye-off');

  tgl.addEventListener('click', () => {
    const showing = pw.type === 'text';
    pw.type = showing ? 'password' : 'text';
    eyeOn.style.display  = showing ? '' : 'none';
    eyeOff.style.display = showing ? 'none' : '';
    pw.focus();
  });

  $('gate').addEventListener('submit', async e => {
    e.preventDefault();
    err.hidden = true;
    btn.disabled = true; btn.textContent = 'Descifrando...';
    try {
      const html = await decrypt(pw.value);
      document.open();
      document.write(html);
      document.close();
    } catch(ex) {
      errmsg.textContent = 'Contraseña incorrecta';
      err.hidden = false;
      btn.disabled = false; btn.textContent = 'Ingresar';
      pw.value = ''; pw.focus();
    }
  });
</script>
